name: Compilar NegativePlayer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Forge 1.20.1
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar mod
        run: gradle clean build jarJar --no-daemon

      - name: Publicar JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NegativePlayer-Forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 14
