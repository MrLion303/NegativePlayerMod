plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.negativestudios'
version = '0.3.2'

base {
    archivesName = 'NegativePlayer'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                negativeplayer {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
        gameTestServer {}
        data {
            args '--mod', 'negativeplayer', '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://keksuccino.github.io/maven/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'

    // Rinku publica un artefacto Forge con versión semántica en su Maven oficial.
    compileOnly fg.deobf('de.keksuccino:rinku-forge:3.0.4-1.20.1')
    jarJar('de.keksuccino:rinku-forge:3.0.4-1.20.1') {
        jarJar.pin(it, '3.0.4-1.20.1')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : '1.20.1',
            minecraft_version_range: '[1.20.1,1.20.2)',
            forge_version           : '47.4.28',
            forge_version_range     : '[47,)',
            loader_version_range    : '[47,)',
            mod_id                  : 'negativeplayer',
            mod_name                : 'NegativePlayer',
            mod_license             : 'All Rights Reserved',
            mod_version             : project.version,
            mod_authors             : 'NegativeStudios',
            mod_description         : 'Reproducción cinematográfica de YouTube y Google Drive con Chromium integrado.'
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}
